version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vapms
      POSTGRES_USER: vapms_user
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - vapms_pgdata:/var/lib/postgresql/data

volumes:
  vapms_pgdata:
